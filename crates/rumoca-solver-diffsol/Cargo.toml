[package]
name = "rumoca-solver-diffsol"
description = "Diffsol-backed simulation runtime for Rumoca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The backend implements only rumoca-solver's FMI ME numerical-plugin
# interface; simulation orchestration and model construction live upstream.
rumoca-solver = { workspace = true }
# The maintained 0.13.2 fork carries the BDF corrections this backend needs
# (docs/dev-guide/src/runtime/diffsol-maintenance.md). A `[patch.crates-io]`
# reaches only builds rooted in this workspace; an application that depends on
# rumoca by git or path would get the registry release, whose accepted BDF state
# disagrees with its own continuous extension.
diffsol = { git = "https://github.com/CogniPilot/diffsol", rev = "4a8aebb83e088cc454d1716c81768eb36386292f" }
self_cell = { workspace = true }

[lints]
workspace = true
